<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waze тест</title>
<style>
:root{--bg:#eef1f4;--s:#fff;--fg:#14191f;--m:#5d6874;--a:#0a6e78;--l:#dde2e8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1317;--s:#171c22;--fg:#e8edf2;--m:#9aa6b2;--a:#3fb6bf;--l:#28313a}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;padding:16px max(16px,env(safe-area-inset-left)) 32px}
h1{font-size:20px;margin:6px 0 4px}
p{color:var(--m);font-size:14px;margin:0 0 14px}
.v{background:var(--s);border:1px solid var(--l);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.v b{font-size:22px;color:var(--a);margin-right:8px}
.v span{font-size:13px;color:var(--m)}
.v a{display:block;margin-top:10px;text-align:center;background:var(--a);color:#fff;text-decoration:none;font-weight:600;padding:12px;border-radius:10px}
code{font-size:11px;word-break:break-all;color:var(--m)}
</style>
</head>
<body>
<h1>Тест на Waze за Android</h1>
<p>Всички бутони водят до НДК, София. Пробвай всеки вариант два пъти: веднъж с <b>напълно затворен</b> Waze (махни го от последните приложения) и веднъж, докато Waze е отворен във фона. Запиши кои букви показват точката с „Send“ и „Routes“.</p>
<div id="list"></div>
<script>
const lat=42.684834,lon=23.318905,ll=lat+','+lon,web='https://waze.com/ul?ll='+ll+'&z=17';
const V=[
 ['A','Приложението Waze директно, без рестарт','intent://?ll='+ll+'&z=17#Intent;scheme=waze;package=com.waze;S.browser_fallback_url='+encodeURIComponent(web)+';end'],
 ['B','Приложението Waze директно, с рестарт (сегашният)','intent://?ll='+ll+'&z=17#Intent;scheme=waze;package=com.waze;launchFlags=0x10008000;S.browser_fallback_url='+encodeURIComponent(web)+';end'],
 ['C','Търсене по координатите в Waze','intent://?q='+encodeURIComponent(ll)+'&ll='+ll+'#Intent;scheme=waze;package=com.waze;end'],
 ['D','Стандартна „гео“ точка, отворена в Waze','intent:0,0?q='+encodeURIComponent(ll+'(НДК)')+'#Intent;scheme=geo;package=com.waze;end'],
 ['E','Уеб линкът (като на iPhone)',web]
];
document.getElementById('list').innerHTML=V.map(([k,t,h])=>`<div class="v"><b>${k}</b><span>${t}</span><a href="${h.replace(/"/g,'&quot;')}"${k==='E'?' target="_blank" rel="noopener"':''}>Отвори в Waze</a><code>${h.replace(/</g,'&lt;')}</code></div>`).join('');
</script>
</body>
</html>
