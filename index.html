<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обекти</title>
<meta name="theme-color" content="#0a6e78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Обекти">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: field tool — sticky search console, one column of site cards, bottom sheets for data management */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --fg:#14191f; --muted:#5d6874; --faint:#8a94a0;
  --line:#dde2e8; --accent:#0a6e78; --accent-ink:#ffffff; --accent-soft:#e1f0f1;
  --waze:#0b7fa8; --waze-soft:#e2f2f8; --danger:#b3261e; --danger-soft:#fbe7e6; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --p0:#c8323a; --p0s:#fbe9ea; --p1:#4b4fb4; --p1s:#ebebfa; --p2:#9a5b00; --p2s:#fbefdc;
  --p3:#2f7d32; --p3s:#e5f3e6; --p4:#a23a8a; --p4s:#f7e6f3; --p5:#4f6475; --p5s:#e8edf1;
  --hl:#fff1b8; --scrim:rgba(12,18,24,.45); --dot:rgba(10,110,120,.07);
  --il-sky1:#cfe9ec; --il-sky2:#f2f9fa; --il-sun:#ffd88a; --il-cloud:#ffffff; --il-hill2:#cbe1df; --il-hill1:#b2d2ce;
  --il-city:#a7c5c2; --il-win:#eef7f6; --il-tower:#2f3d49; --il-tower2:#6d8391; --il-ant:#1c2731; --il-road:#8fb0ac; --il-shadow:rgba(20,40,50,.18);
  --shadow:0 1px 2px rgba(20,30,45,.05),0 2px 8px rgba(20,30,45,.04);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1317; --surface:#171c22; --surface-2:#1d242b; --fg:#e8edf2; --muted:#9aa6b2; --faint:#6e7a86;
  --line:#28313a; --accent:#3fb6bf; --accent-ink:#06282b; --accent-soft:#143236;
  --waze:#5cc3e6; --waze-soft:#14303b; --danger:#ff8a80; --danger-soft:#3a1a18; --warn:#f2c46b; --warn-soft:#3a2d10;
  --p0:#ff7b80; --p0s:#3a1d20; --p1:#a3a6ff; --p1s:#24254a; --p2:#f0b45a; --p2s:#3a2a12;
  --p3:#7fd283; --p3s:#183a1b; --p4:#f08fd8; --p4s:#3a1734; --p5:#a9bccb; --p5s:#26313a;
  --hl:#5a4a10; --scrim:rgba(0,0,0,.6); --shadow:none; --dot:rgba(120,200,210,.06);
  --il-sky1:#0d2a31; --il-sky2:#141f27; --il-sun:#e8e2c6; --il-cloud:#22323b; --il-hill2:#18302f; --il-hill1:#1e3a3b;
  --il-city:#25454b; --il-win:#e9c46a; --il-tower:#c3d2db; --il-tower2:#7d95a2; --il-ant:#e4eef4; --il-road:#35575c; --il-shadow:rgba(0,0,0,.45);
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--fg);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto}
button{font-family:inherit}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:10px;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:relative;overflow:hidden;height:calc(196px + env(safe-area-inset-top,0px));background:linear-gradient(var(--il-sky1),var(--il-sky2) 76%,var(--il-hill2) 82%,var(--il-hill1) 90%)}
.topart{position:absolute;inset:auto 0 0 0;height:196px;display:flex;justify-content:center}
.topart svg{height:100%;width:auto;flex:none}
.topart svg{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
.topart .sun{display:none}
.topin{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin .iconbtn{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.topin #info{background:color-mix(in srgb,var(--surface) 75%,transparent);padding:5px 9px;border-radius:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.topstats{align-self:flex-start;font-size:12.5px;line-height:1.3;color:var(--fg);background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:6px 10px;border-radius:10px}
.topstats b{font-variant-numeric:tabular-nums}
.topstats:empty{display:none}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#1fb5a8));color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.mark .wv{animation:wv 2.6s ease-out infinite}.mark .w2{animation-delay:.35s}
.brand h1{font-size:19px;font-weight:750;margin:0;letter-spacing:-.02em;line-height:1.1}
.brand h1 small{display:block;font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--muted)}
#info{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
#info b{color:var(--fg);font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.searchrow{display:flex;gap:8px}
.field{position:relative;flex:1;min-width:0}
.field svg.s{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
#q{width:100%;height:46px;font:500 17px/1.2 var(--sans);padding:0 44px 0 42px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--fg);outline:none;-webkit-appearance:none;appearance:none}
#q::-webkit-search-cancel-button{display:none}
#q::placeholder{color:var(--faint);font-weight:400}
#q:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
#clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
#meBtn{width:46px;height:46px;border-radius:12px}

.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--sans);padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip span{font:500 11.5px/1 var(--mono);opacity:.75}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nearbar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--fg);font-size:13.5px}
.nearbar svg{color:var(--accent);flex:none}
.nearbar .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nearbar b{font-family:var(--mono);font-weight:600}
.nearbar button{margin-left:auto;flex:none;border:0;background:var(--surface);color:var(--fg);font:600 13px var(--sans);padding:7px 10px;border-radius:8px;cursor:pointer}
.nearbar.err{background:var(--warn-soft)}
.nearbar.live svg{animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.85);opacity:.6}50%{transform:scale(1.08);opacity:1}100%{transform:scale(.85);opacity:.6}}
@keyframes wv{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes bl{0%,55%{opacity:.12}65%{opacity:.95}100%{opacity:.12}}
@keyframes ln{to{stroke-dashoffset:-16}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ill .wv{animation:wv 2.6s ease-out infinite}.ill .w2{animation-delay:.4s}.ill .w3{animation-delay:.8s}
.ill .blink{animation:bl 2.2s linear infinite}.ill .link{animation:ln 1.1s linear infinite}
.ill .pin{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin.radar{border:2px solid currentColor;border-radius:50%;position:relative;animation:none;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,currentColor 55%,transparent) 100%);animation:sp 1.4s linear infinite}
.nearbar.err svg{color:var(--warn)}
.banner{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:13.5px;color:var(--fg)}
.banner button{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;flex:none}

main{padding-top:14px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#list{display:flex;flex-direction:column;gap:10px}

.c{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0;transition:box-shadow .2s,border-color .2s}
@media (hover:hover){.c:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:0 4px 18px rgba(15,40,50,.08)}}
.dirx{display:inline-block;vertical-align:-2px;margin-right:2px}
.c.origin{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.t{display:flex;align-items:center;gap:10px;min-width:0}
.id{font:600 13.5px/1 var(--mono);letter-spacing:.02em;padding:6px 8px 6px 7px;border-radius:7px;background:var(--fg);color:var(--surface);flex:none;display:inline-flex;align-items:center;gap:5px}
.nm{font-weight:600;font-size:17px;letter-spacing:-.005em;min-width:0;overflow-wrap:anywhere;flex:1}
.more-btn{flex:none;width:32px;height:32px;margin:-4px -6px -4px 0;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.more-btn:hover{background:var(--surface-2)}
.ad{font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.note{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--muted)}
.own{font-weight:600;font-size:11.5px;padding:3px 8px;border-radius:20px;letter-spacing:.02em;background:var(--surface-2);color:var(--muted)}
.own.sub{background:transparent;border:1px solid var(--line);font-weight:500}
.p0{background:var(--p0s);color:var(--p0)}.p1{background:var(--p1s);color:var(--p1)}.p2{background:var(--p2s);color:var(--p2)}
.p3{background:var(--p3s);color:var(--p3)}.p4{background:var(--p4s);color:var(--p4)}.p5{background:var(--p5s);color:var(--p5)}
.co{font:500 12.5px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
details.det{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
details.det summary{cursor:pointer;list-style:none;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
details.det summary::-webkit-details-marker{display:none}
details.det summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s}
details.det[open] summary::after{transform:rotate(-135deg)}
details.det dl{margin:0;padding:0 12px 10px;display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:6px 12px;font-size:14px}
details.det dt{color:var(--muted);font-size:13px}
details.det dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
details.det a{color:var(--accent);font-weight:600}
textarea.inp{min-height:76px;resize:vertical;font:15px/1.4 var(--sans)}
.defrow{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.defrow:first-child{border-top:0}
.defrow .nm2{flex:1;min-width:0;font-weight:500}
.defrow .nm2 small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.mini{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center;flex:none}
.mini:disabled{opacity:.35}
.opts{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.opts .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.opt{min-width:32px;height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 13px/1 var(--mono);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.hit:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent)}
.dist{font:600 12px/1 var(--mono);padding:4px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.dist.origin{background:var(--accent);color:var(--accent-ink)}
.nb{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--accent);font:600 13px var(--sans);padding:6px 2px;cursor:pointer}
.b{display:flex;gap:8px;margin-top:4px;padding-top:10px;border-top:1px dashed var(--line)}
.b a,.b button{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:1;text-decoration:none;font:600 15px/1 var(--sans);padding:12px 8px;border-radius:10px;border:0;cursor:pointer}
.b a:active,.b button:active{transform:scale(.98)}
.gm{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 80%,#000));color:var(--accent-ink)}
.wz{background:var(--waze-soft);color:var(--waze)}
.cp{flex:0 0 46px!important;background:transparent;border:1px solid var(--line)!important;color:var(--muted)}
.cp.ok{color:var(--accent);border-color:var(--accent)!important}
.more{display:block;width:100%;padding:13px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--fg);font:600 15px var(--sans);cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.empty{text-align:center;color:var(--muted);padding:36px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg.ill{width:150px;height:auto;margin-bottom:4px}
.empty strong{color:var(--fg);font-size:16px}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;overflow:hidden;box-shadow:var(--shadow)}
.hero{margin:0 -18px;display:block;line-height:0;border-bottom:1px solid var(--line)}
.hero svg{width:100%;height:auto;display:block}
.banner2{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);height:150px;line-height:0;flex:none}
.banner2 svg{position:absolute;inset:0;width:100%;height:100%}
.banner2 .txt{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;line-height:1.25;background:linear-gradient(to top,color-mix(in srgb,var(--surface) 94%,transparent) 30%,transparent)}
.banner2 b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.banner2 span{font-size:13px;color:var(--muted)}
.eyebrow{font:600 11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.welcome h2{margin:-6px 0 0;font-size:24px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.welcome p{margin:0;color:var(--muted);font-size:14.5px}
.lock{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.lock svg{flex:none;color:var(--accent);margin-top:1px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;
  padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel>*{flex-shrink:0}
#fBtn{position:relative;width:46px;height:46px;border-radius:12px}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 11px/19px var(--sans);text-align:center;padding:0 5px;border:2px solid var(--surface);box-sizing:content-box}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1.2 var(--sans);padding:6px 8px 6px 11px;border-radius:20px;background:var(--accent-soft);color:var(--fg);border:0;cursor:pointer;max-width:100%;text-align:left}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg{flex:none;color:var(--accent)}
.pill.clear{background:transparent;color:var(--muted);border:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 13.5px/1 var(--sans);padding:9px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fsec{display:flex;flex-direction:column;gap:8px}
.fsec h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.fsec h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
.fsec h3 button{margin-left:auto;border:0;background:transparent;color:var(--accent);font:600 13px var(--sans);cursor:pointer;padding:2px}
.vlist{max-height:228px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.vlist label{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14.5px;cursor:pointer;border-top:1px solid var(--line)}
.vlist label:first-child{border-top:0}
.vlist input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.vlist .cnt{margin-left:auto;font:12px var(--mono);color:var(--muted);flex:none}
.vlist .v{min-width:0;overflow-wrap:anywhere}
.vlist .em{color:var(--muted);font-style:italic}
.fsticky{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));margin:0 calc(-1 * max(18px,env(safe-area-inset-right,0px))) calc(-18px - env(safe-area-inset-bottom,0px));padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}
.fsticky .btn{flex:1}
.panel::before{content:"";align-self:center;width:38px;height:5px;border-radius:3px;background:var(--line);flex:none}

label.f{display:block;font-size:13px;font-weight:600;color:var(--muted)}
label.f>.inp,label.f>.inrow{margin-top:6px}
label.f em{font-style:normal;color:var(--danger)}
.inp,select.inp{width:100%;font:16px/1.3 var(--sans);padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--fg);outline:none;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.inp:focus{border-color:var(--accent);background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.inrow .inp{flex:1;min-width:0}

.btn.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:10px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14.5px}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted);font-size:12.5px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.sum{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:14.5px}
.sum div:first-child{border-top:0}
.sum b{font-variant-numeric:tabular-nums}
.sum .good b{color:var(--p3)}.sum .chg b{color:var(--p2)}.sum .bad b{color:var(--danger)}
.prev{font:12.5px/1.5 var(--mono);background:var(--surface-2);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--muted)}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--fg)}
.msg.err{background:var(--danger-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--surface);border-radius:12px;padding:11px 14px;font-size:14.5px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast button{border:0;background:transparent;color:var(--accent-soft);font:700 14.5px var(--sans);cursor:pointer;padding:0}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.ill .wv,.mark .wv{opacity:.6}}

<script>
'use strict';
/* ====================== helpers ====================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const TR={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sht',ъ:'a',ь:'y',ю:'yu',я:'ya'};
const tl=s=>s.replace(/[а-я]/g,c=>TR[c]||c);
// loose Latin form: tolerant to c/ts, j/zh, y/i, kh/h spellings
const lz=s=>tl(norm(s)).replace(/tz|ts/g,'c').replace(/sht/g,'st').replace(/zh/g,'j').replace(/kh/g,'h').replace(/[yj]/g,'i').replace(/w/g,'v').replace(/eu/g,'ev').replace(/[^a-z0-9а-я\s]/g,'');
const norm=s=>String(s??'').toLowerCase().replace(/ё/g,'е');
const now=()=>Date.now();
const fmtDate=t=>t?new Date(t).toLocaleString('bg-BG',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const num=n=>Number(n).toLocaleString('bg-BG');
const R=Math.PI/180;
function km(a,b){const la1=a.lat*R,la2=b.lat*R,dl=(b.lon-a.lon)*R,dp=la2-la1;const h=Math.sin(dp/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dl/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(h)));}
const fmtKm=d=>d<1?Math.round(d*100)*10+' м':(d<10?d.toFixed(1).replace('.',','):Math.round(d))+' км';
function brg(a,b){const y=Math.sin((b.lon-a.lon)*R)*Math.cos(b.lat*R),x=Math.cos(a.lat*R)*Math.sin(b.lat*R)-Math.sin(a.lat*R)*Math.cos(b.lat*R)*Math.cos((b.lon-a.lon)*R);return (Math.atan2(y,x)/R+360)%360;}
function dir(a,b){const y=Math.sin((b.lon-a.lon)*R)*Math.cos(b.lat*R),x=Math.cos(a.lat*R)*Math.sin(b.lat*R)-Math.sin(a.lat*R)*Math.cos(b.lat*R)*Math.cos((b.lon-a.lon)*R);
  const deg=(Math.atan2(y,x)/R+360)%360;return ['С','СИ','И','ЮИ','Ю','ЮЗ','З','СЗ'][Math.round(deg/45)%8];}
const fx=n=>String(Math.round(n*1e6)/1e6);
const keyOf=r=>String(r.id).trim().toUpperCase()+'|'+(r.opt||1);
const ownerOf=r=>(r.own||'').trim()||'Без собственик';

const IC={
 map:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
 nav:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg>',
 cp:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
 ok:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 near:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>',
 dots:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
 x:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 table:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.5h18M9 9v11"/></svg>',
 inbox:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>',
 share:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
 trash:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 edit:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
 fields:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M18 15v6M15 18h6"/></svg>',
 key:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
 up:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
 down:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
 lock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
};

/* ====================== storage (IndexedDB, only on this device) ====================== */
const idb={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('obekti',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 get(k){return new Promise((res,rej)=>{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},
 set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}};
let ALL=[];                       // every record, deleted ones kept as markers so deletions spread through packages
let META={author:'',maps:{},pw:'',lastPkg:null,changed:0};
/* extra fields per site: definitions travel inside packages, values live in rec.x */
const DEFAULT_DEFS=[
].map((d,i)=>({opts:[],badge:0,warn:0,...d,ord:i,u:0,by:'',del:0}));
const TYPES={text:'Текст',longtext:'Дълъг текст',phone:'Телефон',number:'Число',choice:'Избор от списък',yesno:'Да / Не'};
let DEFS=[];
const liveDefs=()=>DEFS.filter(d=>!d.del).sort((a,b)=>a.ord-b.ord);
const xsig=o=>JSON.stringify(Object.keys(o.x||{}).filter(k=>String(o.x[k]??'')!=='').sort().map(k=>[k,String(o.x[k])]));
async function persist(){META.changed=now();await idb.set('sites',ALL);await idb.set('defs',DEFS);await idb.set('meta',META);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}

/* ====================== index ====================== */
let L=[],IDX=[],G=[],OPS=[],KEYI=new Map(),OPCLS=new Map();
const PLACE_RE=/(?:^|[\s,(;])(гр|град|с|село)\.?\s+([А-ЯA-Z][^,();\d]*?)\s*(?=[,();]|$)/;
function placeOf(a){const m=String(a||'').match(PLACE_RE);if(!m)return '';return (/^гр|^град/.test(m[1])?'гр. ':'с. ')+m[2].trim().replace(/\s+/g,' ');}
function oblOf(a){const m=String(a||'').match(/обл\.\s*([^,(]+)/);return m?m[1].trim():'';}
let PLACE=[],OBL=[];
function rebuild(){
 L=ALL.filter(r=>!r.del);
 KEYI=new Map(L.map((r,i)=>[r.k,i]));
 PLACE=L.map(r=>placeOf(r.addr));OBL=L.map(r=>oblOf(r.addr));
 IDX=L.map(r=>{const base=norm([r.id,r.name,r.addr,r.own,...Object.values(r.x||{})].join(' '));return base+' '+tl(base)+' '+lz(base)+' '+String(r.id).replace(/\D/g,'').replace(/^0+/,'');});
 const gi=new Map();G=[];
 L.forEach((r,i)=>{const k=String(r.id).toUpperCase();let g=gi.get(k);if(g===undefined){g=G.length;gi.set(k,g);G.push([]);}G[g].push(i);});
 G.forEach(p=>p.sort((a,b)=>(L[a].opt||1)-(L[b].opt||1)));
 G.sort((a,b)=>String(L[a[0]].id).localeCompare(String(L[b[0]].id),'bg',{numeric:true}));
 const cnt=new Map();G.forEach(p=>{const o=ownerOf(L[p[0]]);cnt.set(o,(cnt.get(o)||0)+1)});
 OPS=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(([o])=>o);
 OPCLS=new Map();let n=1;
 OPS.forEach(o=>{OPCLS.set(o,/^a1\b/i.test(o)?'p0':o==='Без собственик'?'p5':'p'+(n>4?4:n++));});
}

/* ====================== address ====================== */
function splitAddr(a){
 const m=String(a).match(/^(.*?)[\s,]*((?:гр\.|с\.)\s*[^,]+?)\s*,\s*общ\.\s*[^,]+,\s*обл\.\s*[^,(]+?(?:\s*\(столица\))?\s*(?:\((.*)\))?\s*$/);
 if(!m)return [a,''];
 const street=m[1].replace(/[,\s]+$/,''),place=m[2].trim(),note=(m[3]||'').trim();
 return [street?street+', '+place:place,note&&norm(note)!==norm(street)?note:''];
}

/* ====================== list & search ====================== */
const list=$('#list'),q=$('#q'),info=$('#info'),clr=$('#clr'),chips=$('#chips'),nearbar=$('#nearbar'),neartxt=$('#neartxt'),meBtn=$('#meBtn');
const PAGE=40;let res=[],shown=0,curTerms=[],opF='all',near=null,me=null,watchId=null,geoErr='';const sel=new Map();
function origin(){if(!near)return null;if(near.type==='me')return me;return near;}
function hl(s){let h=esc(s);if(!curTerms.length)return h;
 const parts=curTerms.filter(t=>t.length>1&&/[^\d]/.test(t)).map(t=>reEsc(esc(t)));if(!parts.length)return h;
 try{return h.replace(new RegExp('('+parts.join('|')+')','gi'),'<mark>$1</mark>');}catch(e){return h;}}

function card(k){
 const it=res[k],g=G[it.g],i=sel.get(it.g)??it.best,r=L[i],ll=fx(r.lat)+','+fx(r.lon);

function parseNum(v){if(typeof v==='number')return v;let s=String(v??'').trim();if(!s)return NaN;
 const d=s.match(/^(-?\d+(?:[.,]\d+)?)\s*[°º˚d]\s*(?:(\d+(?:[.,]\d+)?)\s*['′’m]\s*)?(?:(\d+(?:[.,]\d+)?)\s*(?:["″”]|''|s)?\s*)?([NSEWСЮИЗ])?$/i);
 if(d){let x=+d[1].replace(',','.')+(d[2]?+d[2].replace(',','.')/60:0)+(d[3]?+d[3].replace(',','.')/3600:0);if(d[4]&&/[SWЮЗ]/i.test(d[4]))x=-x;return x;}
 s=s.replace(/^([NSEWСЮИЗ])\s*/i,'').replace(/\s*([NSEWСЮИЗ])$/i,'');
 if(/^-?\d+,\d+$/.test(s))s=s.replace(',','.');return /^-?\d+(\.\d+)?$/.test(s)?+s:NaN;}
function parsePair(v){const s=String(v??'').trim();if(!s)return null;
 let parts;if(s.includes(';'))parts=s.split(';');
 else if(/[°º˚]/.test(s))parts=s.match(/-?\d+(?:[.,]\d+)?\s*[°º˚]\s*(?:\d+(?:[.,]\d+)?\s*['′’]\s*)?(?:\d+(?:[.,]\d+)?\s*(?:["″”]|'')?\s*)?[NSEWСЮИЗ]?/gi)||[];
 else if(s.includes('.'))parts=s.split(/[,\s]+/);else parts=s.split(/\s+|,\s+/);
 parts=parts.map(x=>x.trim()).filter(Boolean);if(parts.length!==2)return null;
 const a=parseNum(parts[0]),b=parseNum(parts[1]);return isFinite(a)&&isFinite(b)?[a,b]:null;}
function fixLatLon(lat,lon){ // Bulgaria: lat ~41–44.5, lon ~22–29
 if(lat>=21&&lat<=30&&lon>=40&&lon<=45)return [lon,lat,true];return [lat,lon,false];}
function defInput(d,val){const v=esc(val??''),id='x_'+d.id;
 let inp;
 if(d.type==='longtext')inp=`<textarea class="inp" id="${id}">${v}</textarea>`;
 else if(d.type==='yesno')inp=`<select class="inp" id="${id}"><option value=""></option>${['Да','Не'].map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(d.type==='choice')inp=`<input class="inp" id="${id}" list="dl_${d.id}" value="${v}" autocomplete="off" placeholder="избери или напиши"><datalist id="dl_${d.id}">${(d.opts||[]).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
 else inp=`<input class="inp" id="${id}" value="${v}" autocomplete="off" ${d.type==='phone'?'type="tel" inputmode="tel"':d.type==='number'?'inputmode="decimal"':''}>`;
 return `<label class="f">${esc(d.name)}${inp}</label>`;}
function openEdit(r){
 const isNew=!r;const v=r||{own:opF!=='all'&&opF!=='Без собственик'?opF:'',id:'',name:'',addr:'',own:'',opt:'',lat:'',lon:''};
 const p=sheet(isNew?'Нов обект':'Редакция',`

 <label class="f">Име<input class="inp" id="eName" value="${esc(v.name)}" autocomplete="off"></label>

 <label class="f">Собственик<input class="inp" id="eOwn" list="opsList" value="${esc(v.own)}" autocomplete="off"></label>
 ${liveDefs().map(d=>defInput(d,(v.x||{})[d.id])).join('')}
 <label class="f">Координати <em>*</em>
  <div class="inrow"><input class="inp" id="eLL" value="${v.lat!==''?esc(fx(v.lat)+', '+fx(v.lon)):''}" placeholder="42.69123, 23.32145" inputmode="text" autocomplete="off">
  <button class="btn small sec" type="button" id="eGps">${IC.nav}Тук</button></div></label>
 <p class="sub" id="eMsg">Можеш да поставиш координати от Google Maps или да натиснеш „Тук“.</p>
 <div class="actions"><button class="btn sec" type="button" data-close>Отказ</button><button class="btn" type="button" id="eSave">Запази</button></div>`);
 const msg=p.querySelector('#eMsg');let overwriteOk=false;
 p.querySelector('#eGps').onclick=()=>{
  if(!navigator.geolocation){msg.textContent='Местоположението не е достъпно.';return;}
  msg.textContent='Търся местоположението…';
  navigator.geolocation.getCurrentPosition(pos=>{p.querySelector('#eLL').value=fx(pos.coords.latitude)+', '+fx(pos.coords.longitude);
    msg.textContent=`Взето от телефона, точност ±${Math.round(pos.coords.accuracy)} м.`+(pos.coords.accuracy>30?' Ако можеш, изчакай на открито и натисни пак.':'');},
   e=>{msg.textContent=e.code===1?'Няма разрешение за местоположение.':'Не успях да определя местоположението.';},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 };
 p.querySelector('#eSave').onclick=async()=>{

  if(!rec.id){msg.className='msg err';msg.textContent='Попълни номера на обекта.';return;}
  const pr=parsePair(g('#eLL'));if(!pr){msg.className='msg err';msg.textContent='Координатите не се разпознават. Пример: 42.69123, 23.32145';return;}
  [rec.lat,rec.lon]=fixLatLon(pr[0],pr[1]);
  rec.x={...((r&&r.x)||{})};
  for(const d of liveDefs()){const el=p.querySelector('#x_'+d.id);if(!el)continue;const val=el.value.trim();if(val)rec.x[d.id]=val;else delete rec.x[d.id];}
  rec.k=keyOf(rec);rec.u=now();rec.by=META.author;rec.del=0;
  const exist=ALL.findIndex(x=>x.k===rec.k);
  if(exist>=0&&!ALL[exist].del&&(isNew||rec.k!==r.k)&&!overwriteOk){msg.className='msg';msg.textContent=`${rec.id} (опция ${rec.opt||1}) вече съществува. Натисни „Запази“ пак, за да го замениш.`;overwriteOk=true;return;}
  if(!isNew&&rec.k!==r.k){const oi=ALL.findIndex(x=>x.k===r.k);if(oi>=0)ALL[oi]={...ALL[oi],del:1,u:now(),by:META.author};}
  if(exist>=0)ALL[exist]=rec;else ALL.push(rec);
  await persist();rebuild();closeSheet();search();toast(isNew?`${rec.id} е добавен`:`${rec.id} е запазен`);
 };
}

function parseRows(){
 const m=IMP.map,recs=[],skipped={noid:0,nocoord:0},seen=new Map();let swapped=0,outside=0;

  let lat,lon;
  if(m.lat!==undefined&&m.lon!==undefined){lat=parseNum(cell(row,'lat'));lon=parseNum(cell(row,'lon'));}
  else if(m.coords!==undefined){const p=parsePair(cell(row,'coords'));if(p){lat=p[0];lon=p[1];}}

  else skipped.nocoord++;

  const gk=id.toUpperCase();
  if(!opt){const n=(seen.get(gk)||0)+1;seen.set(gk,n);opt=n>1?n:null;}
  const rec={id,opt:opt||null,x:{}};if(hasC){rec.lat=Math.round(lat*1e6)/1e6;rec.lon=Math.round(lon*1e6)/1e6;}
  for(const f of ['name','addr','own']){const v=String(cell(row,f)??'').trim();if(v)rec[f]=v;}
  for(const k of Object.keys(m)){if(!k.startsWith('x:'))continue;let v=String(row[m[k]]??'').trim();if(!v)continue;
   const d=DEFS.find(x=>'x:'+x.id===k)||(IMP.pending||[]).find(x=>'x:'+x.id===k);
   if(d&&d.type==='yesno')v=/^(да|yes|y|1|true|x|✓)$/i.test(v)?'Да':/^(не|no|n|0|false)$/i.test(v)?'Не':v;

/* ====================== encrypted package ====================== */
const te=new TextEncoder(),td=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function streamBytes(u8,T){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new T('gzip'))).arrayBuffer());}
async function deriveKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(obj,pw){
 let bytes=te.encode(JSON.stringify(obj));let gz=false;
 if('CompressionStream' in window){try{bytes=await streamBytes(bytes,CompressionStream);gz=true;}catch(e){}}
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=310000;
 const key=await deriveKey(pw,salt,iter);
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));
 return JSON.stringify({format:'obekti-paket',v:1,kdf:'PBKDF2-SHA256',iter,enc:'AES-256-GCM',gz,salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function unseal(text,pw){
 let w;try{w=JSON.parse(text);}catch(e){throw new Error('Това не е пакет с обекти.');}
 if(!w||w.format!=='obekti-paket')throw new Error('Това не е пакет с обекти.');
 const key=await deriveKey(pw,unb64(w.salt),w.iter);
 let bytes;try{bytes=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(w.iv)},key,unb64(w.data)));}catch(e){throw new Error('Грешна парола.');}
 if(w.gz){if(!('DecompressionStream' in window))throw new Error('Телефонът е твърде стар за този пакет. Обнови iOS.');bytes=await streamBytes(bytes,DecompressionStream);}
 return JSON.parse(td.decode(bytes));
}

    catch(e){if(e.name==='AbortError')return;m.innerHTML=`<div class="msg">Споделянето не стана на това устройство. Натисни „Свали файла“ и прати файла както обикновено.</div>`;sh.remove();}
   };
  }catch(e){m.innerHTML=`<div class="msg err">Не успях да направя пакета: ${esc(e.message)}</div>`;}
 };
}
$('#filePkg').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text();openPkgImport(text,f.name);});
function openPkgImport(text,name){
 const p=sheet('Импорт на пакет',`<p class="sub">${esc(name)}</p>${pwFields(false)}<div id="iMsg"></div>
 <div class="actions"><button class="btn sec" type="button" data-close>Отказ</button><button class="btn" type="button" id="iGo">Отключи</button></div>`);
 p.querySelector('#iGo').onclick=async()=>{const pw=p.querySelector('#pw').value,m=p.querySelector('#iMsg');
  m.innerHTML='<div class="sub" style="display:flex;gap:10px;align-items:center"><span class="spin"></span>Отключвам…</div>';
  try{const pkg=await unseal(text,pw);await keepPw(p,pw);openMergePreview(pkg);}
  catch(e){m.innerHTML=`<div class="msg err">${esc(e.message)}</div>`;}
 };
}
// merge rule: union of all objects; for the same object the newer change wins; deletions travel as markers
function planMerge(incoming){
 const map=new Map(ALL.map(r=>[r.k,r]));const out={add:0,upd:0,rm:0,mine:0,apply:[]};
 for(const r of incoming){
  if(!r||!r.k||!isFinite(r.lat)||!isFinite(r.lon))continue;
  const c=map.get(r.k);
  if(!c){out.apply.push(r);if(!r.del)out.add++;continue;}
  if((r.u||0)>(c.u||0)){out.apply.push(r);
   if(r.del&&!c.del)out.rm++;else if(!r.del&&c.del)out.add++;else if(!r.del&&!same(c,r))out.upd++;}
  else if((r.u||0)<(c.u||0)&&(!!r.del!==!!c.del||!same(c,r)))out.mine++;
 }
 return out;
}
function planDefs(inc){const map=new Map(DEFS.map(d=>[d.id,d]));const ap=[];let add=0;
 for(const d of inc||[]){if(!d||!d.id||!d.name||!TYPES[d.type])continue;const c=map.get(d.id);
  if(!c){ap.push(d);if(!d.del)add++;}else if((d.u||0)>(c.u||0))ap.push(d);}
 return {ap,add};}
function openMergePreview(pkg){
 const plan=planMerge(pkg.sites||[]);const pd=planDefs(pkg.defs);
 const p=sheet('Сливане с твоята база',`<p class="sub">Пакет от <b>${esc(pkg.by||'неизвестен')}</b>, направен ${fmtDate(pkg.created)} · ${num((pkg.sites||[]).filter(r=>!r.del).length)} точки</p>
 <div class="sum"><div class="good"><span>Нови за теб</span><b>${num(plan.add)}</b></div><div class="chg"><span>Обновени (по-нова промяна в пакета)</span><b>${num(plan.upd)}</b></div>
 <div class="bad"><span>Изтрити от колегата</span><b>${num(plan.rm)}</b></div><div><span>Твоите по-нови промени, които остават</span><b>${num(plan.mine)}</b></div>
 ${pd.ap.length?`<div><span>Полета: нови или променени</span><b>${num(pd.ap.length)}</b></div>`:''}</div>
 <p class="sub">Нищо от твоята база не се губи. При един и същ обект остава по-новата промяна. След сливането можеш да споделиш обновения пакет.</p>
 <div class="actions"><button class="btn sec" type="button" data-close>Отказ</button><button class="btn" type="button" id="gGo" ${plan.apply.length+pd.ap.length?'':'disabled'}>${plan.apply.length+pd.ap.length?'Слей':'Няма нищо ново'}</button></div>`);
 p.querySelector('#gGo').onclick=async()=>{
  const idx=new Map(ALL.map((r,i)=>[r.k,i]));
  for(const d of pd.ap){const rec={id:String(d.id),name:String(d.name),type:d.type,opts:Array.isArray(d.opts)?d.opts.map(String):[],badge:d.badge?1:0,warn:d.warn?1:0,ord:+d.ord||0,u:d.u||0,by:d.by||'',del:d.del?1:0};
   const i=DEFS.findIndex(x=>x.id===rec.id);if(i>=0)DEFS[i]=rec;else DEFS.push(rec);}
  for(const r of plan.apply){const x={};if(r.x&&typeof r.x==='object')for(const [k,v] of Object.entries(r.x))if(v!==null&&v!==undefined&&String(v)!=='')x[String(k)]=String(v);
   const rec={k:r.k,id:r.id,name:r.name||'',addr:r.addr||'',own:r.own||'',opt:r.opt||null,lat:+r.lat,lon:+r.lon,x,u:r.u||0,by:r.by||'',del:r.del?1:0};
   const i=idx.get(r.k);if(i===undefined){idx.set(r.k,ALL.length);ALL.push(rec);}else ALL[i]=rec;}
  META.lastPkg={by:pkg.by,created:pkg.created};
  await persist();rebuild();closeSheet();search();toast(`Слято: ${plan.add} нови, ${plan.upd} обновени${plan.rm?`, ${plan.rm} изтрити`:''}`);
 };
}
